<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日本語 N5 — Karteikarten</title>
  <meta name="description" content="JLPT N5 Karteikarten mit Spaced Repetition — Kanji, Vokabeln, Grammatik">
  <meta name="theme-color" content="#d4a853">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="N5 日本語">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;600;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- SCREEN: HOME -->
  <div id="screen-home" class="screen active">
    <header class="home-header">
      <div class="fuji-banner" role="img" aria-label="Mount Fuji bei Sonnenuntergang, Pixel-Art">
        <div class="fuji-birds" aria-hidden="true">
          <span class="fuji-bird fuji-bird--1"></span>
          <span class="fuji-bird fuji-bird--2"></span>
        </div>
        <div class="fuji-title">日本語</div>
      </div>
      <div class="home-subtitle">JLPT N5 — Karteikarten</div>
      <div class="app-version">v2.4.1</div>
    </header>

    <div class="deck-grid">
      <button class="deck-card" data-deck="kanji">
        <div class="deck-kanji-preview">漢</div>
        <div class="deck-name">Kanji</div>
        <div class="deck-stats">
          <span class="due-count" id="due-kanji">—</span>
          <span class="deck-total" id="total-kanji">/ 170</span>
        </div>
        <div class="deck-due-label">heute fällig</div>
      </button>

      <button class="deck-card" data-deck="vocab">
        <div class="deck-kanji-preview">語</div>
        <div class="deck-name">Vokabeln</div>
        <div class="deck-stats">
          <span class="due-count" id="due-vocab">—</span>
          <span class="deck-total" id="total-vocab">/ 270</span>
        </div>
        <div class="deck-due-label">heute fällig</div>
      </button>

      <button class="deck-card" data-deck="grammar">
        <div class="deck-kanji-preview">文</div>
        <div class="deck-name">Grammatik</div>
        <div class="deck-stats">
          <span class="due-count" id="due-grammar">—</span>
          <span class="deck-total" id="total-grammar">/ 45</span>
        </div>
        <div class="deck-due-label">heute fällig</div>
      </button>

      <button class="deck-card" data-deck="basics">
        <div class="deck-kanji-preview">常</div>
        <div class="deck-name">Alltag</div>
        <div class="deck-stats">
          <span class="due-count" id="due-basics">—</span>
          <span class="deck-total" id="total-basics">/ 56</span>
        </div>
        <div class="deck-due-label">heute fällig</div>
      </button>

      <button class="deck-card deck-card--all" data-deck="all">
        <div class="deck-kanji-preview">全</div>
        <div class="deck-name">Alles</div>
        <div class="deck-stats">
          <span class="due-count" id="due-all">—</span>
          <span class="deck-total" id="total-all"></span>
        </div>
        <div class="deck-due-label">heute fällig</div>
      </button>
    </div>

    <button id="liste-btn" class="liste-btn">☰ Liste anzeigen</button>

    <div class="home-footer">
      <button id="reset-btn" class="reset-btn">Fortschritt zurücksetzen</button>
      <div class="keyboard-hint">Leertaste = umdrehen &nbsp;·&nbsp; 1 = Nochmal &nbsp;·&nbsp; 3 = Richtig</div>
    </div>
  </div>

  <!-- SCREEN: SESSION -->
  <div id="screen-session" class="screen">
    <div class="session-topbar">
      <button id="back-btn" class="back-btn">← Decks</button>
      <div class="session-info">
        <span id="session-deck-label" class="session-deck-label"></span>
        <span id="session-progress" class="session-progress"></span>
      </div>
    </div>

    <div class="progress-bar-wrap">
      <div id="progress-bar" class="progress-bar"></div>
    </div>

    <div class="card-wrap" id="card-wrap">
      <div class="card" id="flashcard">
        <div class="card-inner" id="card-inner">
          <div class="card-front" id="card-front">
            <!-- filled by JS -->
          </div>
          <div class="card-back" id="card-back">
            <!-- filled by JS -->
          </div>
        </div>
      </div>
    </div>

    <div class="card-controls">
      <button class="flip-btn" id="flip-btn">Karte umdrehen</button>
    </div>

    <div id="mc-choices" class="mc-choices" style="display:none">
      <!-- filled by JS in MC mode -->
    </div>

    <div id="tiles-wrap" style="display:none">
      <div id="tiles-target"></div>
      <div id="tiles-source"></div>
    </div>

    <div class="rating-wrap" id="rating-wrap" style="display:none">
      <div class="rating-hint">Wie gut wusstest du es?</div>
      <div class="rating-buttons">
        <button class="rating-btn rating-nochmal" data-rating="1">
          <span class="rating-label">Nochmal</span>
          <span class="rating-interval" id="int-1"></span>
        </button>
        <button class="rating-btn rating-richtig" data-rating="3">
          <span class="rating-label">Richtig</span>
          <span class="rating-interval" id="int-3"></span>
        </button>
      </div>
    </div>
  </div>

  <!-- SCREEN: DONE -->
  <div id="screen-done" class="screen">
    <div class="done-wrap">
      <div class="done-kanji">完</div>
      <h2 class="done-title">Session abgeschlossen</h2>
      <div class="done-stats" id="done-stats">
        <!-- filled by JS -->
      </div>
      <div class="done-actions">
        <button id="done-again-btn" class="done-btn done-btn--primary">Nochmal</button>
        <button id="done-home-btn" class="done-btn">Zurück zu Decks</button>
      </div>
    </div>
  </div>

  <!-- SCREEN: LIST -->
  <div id="screen-list" class="screen">
    <div class="list-header">
      <button id="list-back-btn" class="list-back-btn">←</button>
      <h2 class="list-title">Liste</h2>
    </div>
    <input type="search" class="list-search" id="list-search" placeholder="Suchen …">
    <div class="list-tabs">
      <button class="list-tab active" data-list-tab="kanji">Kanji</button>
      <button class="list-tab" data-list-tab="vocab">Vokabeln</button>
      <button class="list-tab" data-list-tab="grammar">Grammatik</button>
      <button class="list-tab" data-list-tab="adjektive">Adjektive</button>
      <button class="list-tab" data-list-tab="ausdruecke">Ausdrücke</button>
    </div>
    <div class="list-divider"></div>
    <div id="list-content" class="list-content"></div>
  </div>

  <!-- Start modal -->
  <div id="start-modal" class="modal-overlay hidden" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="start-modal-title">
    <div class="modal-card">
      <button class="modal-close" id="start-modal-close" aria-label="Schließen">×</button>
      <h2 class="modal-title" id="start-modal-title">Üben</h2>

      <div class="modal-section">
        <div class="modal-label">Modus</div>
        <div class="mode-toggle" id="modal-mode-toggle"></div>
      </div>

      <div class="modal-section" id="modal-direction-wrap">
        <div class="modal-label">Richtung</div>
        <div class="direction-toggle">
          <button class="dir-btn active" data-dir="jp-de">JP → DE</button>
          <button class="dir-btn" data-dir="de-jp">DE → JP</button>
          <button class="dir-btn" data-dir="both">Beide</button>
        </div>
      </div>

      <button id="modal-start-btn" class="modal-start-btn">Start</button>
    </div>
  </div>

  <!-- Data files first, then app logic -->
  <script src="data/kanji.js"></script>
  <script src="data/vocab.js"></script>
  <script src="data/grammar.js"></script>
  <script src="data/basics.js"></script>
  <script src="app.js"></script>
</body>
</html>
